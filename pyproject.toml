[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teptris"
version = "0.3.0.1"
description = "TOML for Python at libteptris speed (native C extension, no fallback)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/leptris/teptris-py"
Changelog = "https://github.com/leptris/teptris-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/leptris/teptris-py/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teptris = ["py.typed", "*.pyi", "_platform/**/*", "*.so", "*.so.*", "*.dylib", "*.dylib.*", "*.dll",
           "_engine/LICENSE.md",
           "_engine/src/teptris/*.c", "_engine/src/teptris/*/*.c", "_engine/src/teptris/*/*/*.c",
           "_engine/src/teptris/*.h", "_engine/src/teptris/*/*.h", "_engine/src/teptris/*/*/*.h",
           "_engine/src/include/teptris/*.h"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
# naive datetimes are part of the contract under test (tomllib parity)
"tests/**" = ["DTZ"]
