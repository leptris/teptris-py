name: binding-bench

# Guards the Python BINDING hot path (_native.c: loads/dumps
# materialization, error paths) against silent regressions: every
# main push benches HEAD against the latest PUBLISHED wheel on the
# same runner (median-of-3; the engine has its own A/B lane and
# cannot see the binding layer). Mirrors teptris-ruby's lane.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prev-vs-head:
    name: previous wheel vs HEAD (regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout libteptris (the C core)
        uses: actions/checkout@v7
        with:
          repository: leptris/teptris
          path: libteptris-src
          ref: v0.3.7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # PGO+LTO — the exact config the linux wheel cells build. A
      # plain (non-PGO) HEAD loses ~10% on engine-bound shapes
      # (dump_medium 0.894-0.897 vs the 0.90 gate: structurally under,
      # both runs red since the lane landed) and the comparison would
      # measure the build config, not the binding.
      - name: Build the C archive (PGO, the wheel config)
        run: |
          set -eux
          python3 -m pip install -q cmake ninja
          python3 libteptris-src/scripts/gen_bench_corpus.py libteptris-src/bench-corpus
          TEPTRIS_PGO_LTO=1 bash libteptris-src/scripts/build-pgo.sh \
            libteptris-src libteptris-src/build libteptris-src/bench-corpus

      - name: Install HEAD into venv A
        run: |
          python3 -m venv /tmp/head
          /tmp/head/bin/pip install -q "setuptools>=61" wheel
          TEPTRIS_INCLUDE="$PWD/libteptris-src/src/include" \
            TEPTRIS_LIBDIR="$PWD/libteptris-src/build/src" \
            /tmp/head/bin/pip install -q --no-build-isolation .

      - name: Install the latest published wheel into venv B
        run: |
          python3 -m venv /tmp/prev
          V=$(curl -s https://pypi.org/pypi/teptris/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          echo "prev wheel: $V"
          /tmp/prev/bin/pip install -q "teptris==$V"

      - name: Bench previous vs HEAD
        run: |
          /tmp/prev/bin/python benchmark/prev_vs_head.py prev > prev.txt
          /tmp/head/bin/python benchmark/prev_vs_head.py head > head.txt
          cat prev.txt head.txt

      - name: Gate (HEAD must be >= 90% of the published wheel)
        run: |
          set -e
          for m in load_small load_medium dump_medium dump_json_natural_medium; do
            p=$(awk -v m="$m" '$2==m && $1=="prev" {print $3}' prev.txt)
            h=$(awk -v m="$m" '$2==m && $1=="head" {print $3}' head.txt)
            ratio=$(awk -v h="$h" -v p="$p" 'BEGIN { printf "%.3f", h/p }')
            echo "$m: prev=$p head=$h ratio=$ratio"
            if awk -v r="$ratio" 'BEGIN { exit !(r < 0.90) }'; then
              echo "::error::binding regression: $m ratio $ratio < 0.90"
              exit 1
            fi
          done
          echo "no binding regression (all ratios >= 0.90)"
