name: binding-bench

# Guards the Python BINDING hot path (_native.c: loads/dumps
# materialization, error paths) against silent regressions: every
# main push benches HEAD against the latest RELEASE, both as PLAIN
# SOURCE builds on the same runner (median-of-3; the engine has its
# own A/B lane and cannot see the binding layer). Mirrors
# teptris-ruby's lane.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prev-vs-head:
    name: previous wheel vs HEAD (regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout libteptris (the C core)
        uses: actions/checkout@v7
        with:
          repository: leptris/teptris
          path: libteptris-src
          ref: v0.3.10

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # BOTH SIDES are plain source builds on this runner with this
      # compiler - that is what makes the ratio measure the binding.
      # Matching the PUBLISHED wheel's config was tried and cannot be
      # hit exactly: the wheel builds inside the manylinux container
      # with its own PGO toolchain, and even with the same
      # build-pgo.sh on the runner, identical source measured
      # dump_medium 0.851 (three data points: 0.810/0.851 + a
      # broken-config local 0.635) - a container-vs-runner artifact,
      # not a binding regression. The released SDIST is the honest
      # `prev`: same cmake path, same compiler, only the binding
      # source differs.
      - name: Build the C archive (plain, both sides identical)
        run: |
          set -eux
          python3 -m pip install -q cmake ninja
          cmake -B libteptris-src/build -S libteptris-src \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DTEPTRIS_BUILD_CLI=OFF -DTEPTRIS_BUILD_SHARED=OFF \
            -DTEPTRIS_BUILD_STATIC=ON -DTEPTRIS_ENABLE_LTO=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build libteptris-src/build -j

      - name: Install HEAD into venv A
        run: |
          python3 -m venv /tmp/head
          /tmp/head/bin/pip install -q "setuptools>=61" wheel
          TEPTRIS_INCLUDE="$PWD/libteptris-src/src/include" \
            TEPTRIS_LIBDIR="$PWD/libteptris-src/build/src" \
            /tmp/head/bin/pip install -q --no-build-isolation .

      - name: Install the latest release's sdist into venv B
        run: |
          python3 -m venv /tmp/prev
          # the sdist build needs setuptools in the venv (--no-build-isolation)
          /tmp/prev/bin/pip install -q "setuptools>=61" wheel
          V=$(curl -s https://pypi.org/pypi/teptris/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          echo "prev sdist: $V"
          /tmp/prev/bin/pip download -q "teptris==$V" --no-binary :all: --no-deps -d /tmp/prevsrc
          /tmp/prev/bin/pip install -q --no-build-isolation /tmp/prevsrc/teptris-*.tar.gz

      - name: Bench previous vs HEAD
        run: |
          /tmp/prev/bin/python benchmark/prev_vs_head.py prev > prev.txt
          /tmp/head/bin/python benchmark/prev_vs_head.py head > head.txt
          cat prev.txt head.txt

      - name: Gate (HEAD must be >= 90% of the published wheel)
        run: |
          set -e
          for m in load_small load_medium dump_medium dump_json_natural_medium; do
            p=$(awk -v m="$m" '$2==m && $1=="prev" {print $3}' prev.txt)
            h=$(awk -v m="$m" '$2==m && $1=="head" {print $3}' head.txt)
            ratio=$(awk -v h="$h" -v p="$p" 'BEGIN { printf "%.3f", h/p }')
            echo "$m: prev=$p head=$h ratio=$ratio"
            if awk -v r="$ratio" 'BEGIN { exit !(r < 0.90) }'; then
              echo "::error::binding regression: $m ratio $ratio < 0.90"
              exit 1
            fi
          done
          echo "no binding regression (all ratios >= 0.90)"
