name: Release wheels

# Native-extension wheels (no fallback): every wheel builds teptris._native
# against the C core at the lockstep tag and bundles the shared library
# chain beside it (@loader_path rpath on ELF/Mach-O).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    name: Wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Resolve the lockstep coordinates
        shell: bash
        run: |
          set -eu
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          # Lockstep pin: binding 0.2.0 rides libteptris 0.1.1 (the C
          # core has no 0.2.x; bump this pin when the C tag moves).
          echo "C_TAG=v0.1.12" >> "$GITHUB_ENV"
          echo "PY_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Checkout libteptris (the C core, at the tag)
        uses: actions/checkout@v4
        with:
          repository: leptris/teptris
          path: libteptris-src
          ref: ${{ env.C_TAG }}

      - name: Install build tooling
        shell: bash
        run: |
          # ninja via pip: official wheels for every OS (Windows runners ship
          # cmake/MSVC already; no apt/brew exists there)
          python3 -m pip install -q setuptools wheel build ninja auditwheel
          case "$(uname -s)" in
            Linux)  sudo apt-get update -qq && sudo apt-get install -y -qq cmake >/dev/null ;;
            Darwin) brew install cmake ;;
          esac

      - name: Build the C shared library (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -B libteptris-src/build -S libteptris-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DTEPTRIS_BUILD_CLI=OFF -DTEPTRIS_BUILD_SHARED=ON \
            -DTEPTRIS_BUILD_STATIC=OFF
          cmake --build libteptris-src/build

      # cl is not on bash PATH; cmake must be configured inside the MSVC
      # environment so library (teptris.lib) and extension share toolchains.
      # STATIC=OFF: on MSVC+Ninja the static lib and the shared import lib
      # would both emit src/teptris.lib and ninja aborts on the collision.
      - name: Build the C shared library (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          rem MSVC puts the import lib in the ARCHIVE dir (build root by
          rem default); keep it beside the dll where setup.py links from
          cmake -B libteptris-src/build -S libteptris-src -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DTEPTRIS_BUILD_CLI=OFF -DTEPTRIS_BUILD_SHARED=ON -DTEPTRIS_BUILD_STATIC=OFF -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=%CD%\libteptris-src\build\src
          cmake --build libteptris-src/build

      - name: Build the extension in place
        env:
          TEPTRIS_INCLUDE: ${{ github.workspace }}/libteptris-src/src/include
          TEPTRIS_LIBDIR: ${{ github.workspace }}/libteptris-src/build/src
        shell: bash
        run: |
          python3 setup.py build_ext --inplace
          ls -la libteptris-src/build/src/
          case "$(uname -s)" in
            Darwin) cp -L libteptris-src/build/src/libteptris.0.dylib src/teptris/ ;;
            Linux)  cp -L libteptris-src/build/src/libteptris.so.0 src/teptris/
                    cp -L libteptris-src/build/src/libteptris.so.0.* src/teptris/ || true ;;
            MINGW*) cp libteptris-src/build/src/Release/teptris.dll src/teptris/ 2>/dev/null ||
                      cp libteptris-src/build/src/teptris.dll src/teptris/ ;;
          esac
          ls -la src/teptris/

      - name: Build the wheel (no isolation; ext already built)
        env:
          TEPTRIS_INCLUDE: ${{ github.workspace }}/libteptris-src/src/include
          TEPTRIS_LIBDIR: ${{ github.workspace }}/libteptris-src/build/src
        run: python3 -m build --wheel --no-isolation
        shell: bash

      - name: Finalize (macOS platform tag / manylinux repair)
        shell: bash
        run: |
          mkdir -p dist/final
          case "$(uname -s)" in
            Darwin)
              arch=$(uname -m)
              python3 -m wheel tags --platform-tag "macosx_11_0_${arch}" --remove dist/*.whl
              mv dist/*.whl dist/final/ ;;
            Linux)
              # the shared library ships inside the wheel (package-data);
              # retag rather than repair — auditwheel cannot relocate a
              # soname lib that the ext loads via $ORIGIN
              arch=$(uname -m)
              python3 -m wheel tags --platform-tag \
                "manylinux2014_${arch}.manylinux_2_17_${arch}" --remove dist/*.whl
              mv dist/*.whl dist/final/ ;;
            *) # Windows wheels self-tag via the .pyd
              cp dist/*.whl dist/final/ ;;
          esac
          ls -la dist/final/

      - name: Smoke test the installed wheel
        shell: bash
        run: |
          python3 -m venv /tmp/smoke
          case "$(uname -s)" in
            MINGW*|MSYS*) PY=/tmp/smoke/Scripts/python ;;
            *)            PY=/tmp/smoke/bin/python ;;
          esac
          $PY -m pip install -q dist/final/*.whl
          cd /tmp && env -u TEPTRIS_LIB_PATH $PY -c \
            "import teptris; assert teptris.loads('a = 1') == {'a': 1}; \
             o = teptris.loads('t = 07:32\n[m]\nk = 1.5\n'); \
             assert teptris.loads(teptris.dumps(o)) == o; print('smoke ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: dist/final/*.whl

      - name: Attach wheels to the release
        if: startsWith(github.ref, 'refs/tags/v')
        # 20 matrix cells race one release; PyPI (manual twine from the
        # artifacts) is the delivery channel, so attachment failures
        # (create/upload races) must not fail the build
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: dist/final/*.whl
