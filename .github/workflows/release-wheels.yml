name: Release wheels

# Native-extension wheels (no fallback): every wheel builds teptris._native
# against the C core at the lockstep tag and bundles the shared library
# chain beside it (@loader_path rpath on ELF/Mach-O).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    name: Wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve the lockstep coordinates
        run: |
          set -eu
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          C_VERSION=$(echo "$VERSION" | cut -d. -f1-3)
          echo "C_TAG=v${C_VERSION}" >> "$GITHUB_ENV"
          echo "PY_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Checkout libteptris (the C core, at the tag)
        uses: actions/checkout@v4
        with:
          repository: leptris/teptris
          path: libteptris-src
          ref: ${{ env.C_TAG }}

      - name: Install build tooling
        run: |
          python3 -m pip install -q setuptools wheel build auditwheel
          if [ "$(uname -s)" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build >/dev/null; else brew install cmake ninja; fi

      - name: Build the C shared library
        run: |
          cmake -B libteptris-src/build -S libteptris-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DTEPTRIS_BUILD_CLI=OFF -DTEPTRIS_BUILD_SHARED=ON
          cmake --build libteptris-src/build

      - name: Build the extension in place
        env:
          TEPTRIS_INCLUDE: ${{ github.workspace }}/libteptris-src/src/include
          TEPTRIS_LIBDIR: ${{ github.workspace }}/libteptris-src/build/src
        run: |
          python3 setup.py build_ext --inplace
          if [ "$(uname -s)" = "Darwin" ]; then
            cp libteptris-src/build/src/libteptris.0.dylib src/teptris/ 2>/dev/null || true
          else
            cp libteptris-src/build/src/libteptris.so.0* src/teptris/ 2>/dev/null || true
          fi

      - name: Build the wheel (no isolation; ext already built)
        env:
          TEPTRIS_INCLUDE: ${{ github.workspace }}/libteptris-src/src/include
          TEPTRIS_LIBDIR: ${{ github.workspace }}/libteptris-src/build/src
        run: python3 -m build --wheel --no-isolation

      - name: Finalize (macOS platform tag / manylinux repair)
        run: |
          mkdir -p dist/final
          if [ "$(uname -s)" = "Darwin" ]; then
            python3 -m wheel tags --platform-tag macosx_11_0_arm64 --remove dist/*.whl
            mv dist/*.whl dist/final/
          else
            auditwheel repair dist/*.whl -w dist/final
          fi
          ls -la dist/final/

      - name: Smoke test the installed wheel
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q dist/final/*.whl
          cd /tmp && env -u TEPTRIS_LIB_PATH /tmp/smoke/bin/python -c \
            "import teptris; assert teptris.loads('a = 1') == {'a': 1}; print('smoke ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/final/*.whl

      - name: Attach wheels to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/final/*.whl
