name: Release wheels

# Native-extension wheels (no fallback): every wheel builds teptris._native
# against the C core at the lockstep tag and bundles the shared library
# beside it (@loader_path rpath on Mach-O, $ORIGIN on ELF, DLL next to the
# .pyd on Windows). Musl wheels build inside an Alpine container (wheel-musl).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    name: Wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # no macOS arm64 interpreters before 3.10; x86_64 macs (and
          # Rosetta pythons) resolve the macos-15-intel wheels
          - { os: macos-latest,    python: "3.8" }
          - { os: macos-latest,    python: "3.9" }
          # ARM64 Windows interpreters exist only for 3.11+
          - { os: windows-11-arm,  python: "3.8" }
          - { os: windows-11-arm,  python: "3.9" }
          - { os: windows-11-arm,  python: "3.10" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Resolve the lockstep coordinates
        shell: bash
        run: |
          set -eu
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          # Lockstep pin: the binding rides the C core tag below; bump
          # this pin when the C tag moves.
          echo "C_TAG=v0.1.16" >> "$GITHUB_ENV"
          echo "PY_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Checkout libteptris (the C core, at the tag)
        uses: actions/checkout@v4
        with:
          repository: leptris/teptris
          path: libteptris-src
          ref: ${{ env.C_TAG }}

      - name: Install build tooling
        shell: bash
        run: |
          # ninja via pip: official wheels for every OS (Windows runners ship
          # cmake/MSVC already; no apt/brew exists there)
          # ">=61" matters: the 3.8 toolcache ships setuptools 56, and a
          # bare 'pip install setuptools' is a no-op once any version is
          # present — build --no-isolation then misses the floor
          python3 -m pip install -q "setuptools>=61" wheel build ninja auditwheel
          case "$(uname -s)" in
            Linux)  sudo apt-get update -qq && sudo apt-get install -y -qq cmake >/dev/null ;;
            Darwin) brew install cmake ;;
          esac

      # Two-stage PGO (C core script): instrumented build, training via
      # the teptris CLI over a generated corpus, -fprofile-use rebuild.
      # Measured +3-13% on the parse shapes (C repo benchmarks/LEDGER.md).
      - name: Build the C shared library with PGO (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 libteptris-src/scripts/gen_bench_corpus.py libteptris-src/bench-corpus
          # static flavor: one self-contained module, no chain to ship
          TEPTRIS_PGO_LTO=1 \
            bash libteptris-src/scripts/build-pgo.sh \
              libteptris-src libteptris-src/build libteptris-src/bench-corpus

      # cl is not on bash PATH; cmake must be configured inside the MSVC
      # environment so library (teptris.lib) and extension share toolchains.
      # Static, plain (no PGO/LTO): MSVC PGO is inherently LTCG and the
      # setuptools link adds no /LTCG — with the static archive the .pyd
      # link must stay plain. One self-contained module, no DLL to ship
      # (the loader chain problems die with the chain).
      - name: Build the C static library (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSPATH=%%i"
          if "%RUNNER_ARCH%"=="ARM64" (call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" arm64) else (call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat")
          cmake -B libteptris-src/build -S libteptris-src -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DTEPTRIS_BUILD_CLI=OFF -DTEPTRIS_BUILD_SHARED=OFF -DTEPTRIS_BUILD_STATIC=ON -DTEPTRIS_ENABLE_LTO=OFF -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=%CD%\libteptris-src\build\src
          cmake --build libteptris-src/build

      - name: Build the extension in place
        env:
          TEPTRIS_INCLUDE: ${{ github.workspace }}/libteptris-src/src/include
          TEPTRIS_LIBDIR: ${{ github.workspace }}/libteptris-src/build/src
        shell: bash
        run: |
          python3 setup.py build_ext --inplace
          ls -la libteptris-src/build/src/ src/teptris/

      - name: Build the wheel (no isolation; ext already built)
        env:
          TEPTRIS_INCLUDE: ${{ github.workspace }}/libteptris-src/src/include
          TEPTRIS_LIBDIR: ${{ github.workspace }}/libteptris-src/build/src
        run: python3 -m build --wheel --no-isolation
        shell: bash

      - name: Finalize (macOS platform tag / manylinux repair)
        shell: bash
        run: |
          mkdir -p dist/final
          case "$(uname -s)" in
            Darwin)
              arch=$(uname -m)
              python3 -m wheel tags --platform-tag "macosx_11_0_${arch}" --remove dist/*.whl
              mv dist/*.whl dist/final/ ;;
            Linux)
              # the shared library ships inside the wheel (package-data);
              # retag rather than repair — auditwheel cannot relocate a
              # soname lib that the ext loads via $ORIGIN
              arch=$(uname -m)
              python3 -m wheel tags --platform-tag \
                "manylinux2014_${arch}.manylinux_2_17_${arch}" --remove dist/*.whl
              mv dist/*.whl dist/final/ ;;
            *) # Windows wheels self-tag via the .pyd
              cp dist/*.whl dist/final/ ;;
          esac
          ls -la dist/final/

      # venv-free smoke: the 3.8 windows toolcache dies inside venv
      # bootstrap (WinError 2 spawning the venv python); a --target
      # install exercises the same wheel contents on every cell.
      # CWD import keeps the path POSIX-shell-only — no env-var
      # translation trouble for native Windows python.
      - name: Smoke test the installed wheel
        shell: bash
        run: |
          python3 -m pip install -q --target /tmp/smokelib dist/final/*.whl
          cd /tmp/smokelib && env -u TEPTRIS_LIB_PATH python3 -c \
            "import teptris; assert teptris.loads('a = 1') == {'a': 1}; \
             o = teptris.loads('t = 07:32\n[m]\nk = 1.5\n'); \
             assert teptris.loads(teptris.dumps(o)) == o; print('smoke ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: dist/final/*.whl

      - name: Attach wheels to the release
        if: startsWith(github.ref, 'refs/tags/v')
        # matrix cells race one release; PyPI (manual twine from the
        # artifacts) is the delivery channel, so attachment failures
        # (create/upload races) must not fail the build
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: dist/final/*.whl

  wheel-musl:
    name: Wheel (musl) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout libteptris (the C core, at the tag)
        uses: actions/checkout@v4
        with:
          repository: leptris/teptris
          path: libteptris-src
          ref: v0.1.16

      # Musl builds in an Alpine container (JS actions stay on the host);
      # the smoke test runs inside the container — a glibc host python
      # cannot load the musl extension.
      - name: Build and smoke-test the wheel in an Alpine container
        env:
          PY: ${{ matrix.python }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e py="${PY}" \
            "python:${PY}-alpine" sh -c '
              set -eux
              apk add --no-cache build-base cmake ninja bash
              python3 /work/libteptris-src/scripts/gen_bench_corpus.py /work/libteptris-src/bench-corpus
              TEPTRIS_PGO_LTO=1 bash /work/libteptris-src/scripts/build-pgo.sh /work/libteptris-src /work/libteptris-src/build /work/libteptris-src/bench-corpus
              pip install -q "setuptools>=61" wheel build
              export TEPTRIS_INCLUDE=/work/libteptris-src/src/include
              export TEPTRIS_LIBDIR=/work/libteptris-src/build/src
              python setup.py build_ext --inplace
              python -m build --wheel --no-isolation
              mkdir -p dist/final
              arch=$(uname -m)
              python -m wheel tags --platform-tag "musllinux_1_2_${arch}" --remove dist/*.whl
              mv dist/*.whl dist/final/
              pip install -q dist/final/*.whl
              cd /tmp && python - <<"PYEOF"
          import teptris
          assert teptris.loads("a = 1") == {"a": 1}
          o = teptris.loads("t = 07:32\n[m]\nk = 1.5\n")
          assert teptris.loads(teptris.dumps(o)) == o
          print("musl smoke ok")
          PYEOF
            '

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musl-${{ matrix.os }}-${{ matrix.python }}
          path: dist/final/*.whl

      - name: Attach wheels to the release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: dist/final/*.whl
