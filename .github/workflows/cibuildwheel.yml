name: cibuildwheel

# cibuildwheel matrix over the static _native module (0.2.10): the lib
# builds once per platform — two-stage PGO on clang/gcc, plain on MSVC
# (LTCG-bound) — and every CPython links the same archive. Repair and
# platform tags are cibuildwheel's; the module is self-contained so
# there is nothing to relocate.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout libteptris (the C core)
        uses: actions/checkout@v4
        with:
          repository: leptris/teptris
          path: libteptris-src
          ref: v0.1.16

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the C static library (PGO where it pays)
        shell: bash
        env:
          CIBW_ARCHS_MACOS: ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
        run: |
          bash scripts/ci-lib-build.sh

      - name: cibuildwheel
        uses: pypa/cibuildwheel@v3.0.1
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_i686"
          CIBW_ARCHS_WINDOWS: ${{ runner.arch == 'ARM64' && 'ARM64' || 'AMD64' }}
          CIBW_ARCHS_MACOS: ${{ env.CIBW_ARCHS_MACOS }}
          CIBW_ENVIRONMENT: >-
            TEPTRIS_INCLUDE=/project/libteptris-src/src/include
            TEPTRIS_LIBDIR=/project/libteptris-src/build/src
          CIBW_ENVIRONMENT_WINDOWS: >-
            TEPTRIS_INCLUDE=/project/libteptris-src/src/include
            TEPTRIS_LIBDIR=/project/libteptris-src/build/src
          CIBW_TEST_COMMAND: >-
            python -c "import teptris; assert teptris.loads('a = 1') == {'a': 1};
            o = teptris.loads('t = 07:32\n[m]\nk = 1.5\n');
            assert teptris.loads(teptris.dumps(o)) == o; print('smoke ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
