name: cibuildwheel

# abi3 wheels (closes #20): one cp39-abi3 wheel per platform covers every
# CPython >= 3.9. Linux cells build the C archive INSIDE each container
# (manylinux and musllinux must link their own libc); macOS and Windows
# build on the runner once (clang/gcc PGO, plain MSVC). The module links
# the static archive, so nothing needs repair or relocation.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # a PR that touches the release machinery rehearses the full
  # wheel + sdist + doctrine matrix - release-only breakage (the
  # ruby 0.2.42 class) surfaces in the PR instead of the tag build
  pull_request:
    paths:
      - ".github/workflows/cibuildwheel.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Source distribution: the engine is vendored and compiles at
  # pip-install time (setup.py vendored mode) — every platform with a
  # C compiler, including the ones no wheel covers.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/make-sdist.sh
      # self-test: install FROM the tarball and round-trip — the
      # 0.2.15 broken-sdist class must die here, not on users
      # (absolute paths slipped past a 3.12-only verification once)
      - name: Self-test the sdist (3.9, strict)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: |
          python3 -m pip install -q virtualenv
          python3 -m virtualenv /tmp/sdt && /tmp/sdt/bin/python -m pip install -q dist/*.tar.gz
          /tmp/sdt/bin/python -c "import teptris; assert teptris.loads('a = 1') == {'a': 1}; print('sdist self-test OK')"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Packaging-doctrine gate (teptris-py#77): the delivery channel is
  # manual twine from these artifacts, so the run must only be green
  # when EVERY wheel carries the compiled binary AND the vendored
  # engine source, and the sdist carries the source tree that
  # compiles at install. Publish anything that fails this and the
  # doctrine regressed silently.
  verify-doctrine:
    needs: [sdist, wheels]
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: artifacts
      - name: Verify the doctrine halves in every artifact
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          wheels = glob.glob("artifacts/*.whl")
          assert wheels, "no wheel artifacts"
          for w in wheels:
              names = zipfile.ZipFile(w).namelist()
              binary = [n for n in names if "_native" in n and (n.endswith(".so") or n.endswith(".pyd") or n.endswith(".dylib"))]
              sources = [n for n in names if n.startswith("teptris/_engine/src/") and (n.endswith(".c") or n.endswith(".h"))]
              assert binary, f"{w}: no compiled engine binary"
              assert len(sources) >= 20, f"{w}: only {len(sources)} engine sources"
              assert "teptris/_engine/LICENSE.md" in names, f"{w}: engine LICENSE missing"
              print(f"doctrine OK {w}: {len(sources)} sources + {binary[0]}")
          sdists = glob.glob("artifacts/*.tar.gz")
          assert sdists, "no sdist artifact"
          with tarfile.open(sdists[0]) as t:
              names = t.getnames()
          sources = [n for n in names if "/vendor/libteptris/src/" in n and (n.endswith(".c") or n.endswith(".h"))]
          assert len(sources) >= 20, f"{sdists[0]}: only {len(sources)} engine sources"
          assert any(n.endswith("setup.py") for n in names), "setup.py missing from sdist"
          print(f"doctrine OK {sdists[0]}: {len(sources)} sources")
          PY

  wheels:
    name: ${{ matrix.builds }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # plain cp39 identifiers: the abi3 wheel tag comes from
          # bdist_wheel py_limited_api, NOT from the selector (cibuildwheel
          # has no abi3 grammar; build the minimum CPython, tag it abi3)
          - { os: ubuntu-latest,     builds: cp39-manylinux_x86_64 }
          - { os: ubuntu-latest,     builds: cp39-musllinux_x86_64 }
          # 32-bit ARM: no runners exist; CIBW_ARCHS_LINUX selects the
          # cross build and the containers run under qemu binfmt
          # (installed below; native cells keep the auto default)
          - { os: ubuntu-latest,     builds: cp39-manylinux_armv7l, archs: armv7l }
          - { os: ubuntu-latest,     builds: cp39-musllinux_armv7l, archs: armv7l }
          # big-endian server arches, emulated (qemu binfmt below)
          - { os: ubuntu-latest,     builds: cp39-manylinux_ppc64le, archs: ppc64le }
          - { os: ubuntu-latest,     builds: cp39-manylinux_s390x, archs: s390x }
          - { os: ubuntu-24.04-arm,  builds: cp39-manylinux_aarch64 }
          - { os: ubuntu-24.04-arm,  builds: cp39-musllinux_aarch64 }
          - { os: macos-latest,      builds: cp39-macosx_arm64 }
          - { os: macos-15-intel,    builds: cp39-macosx_x86_64 }
          - { os: windows-latest,    builds: cp39-win_amd64 }
          - { os: windows-11-arm,    builds: cp39-win_arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Checkout libteptris (the C core)
        uses: actions/checkout@v4
        with:
          repository: leptris/teptris
          path: libteptris-src
          ref: v0.1.25

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # runner-side build for mac (clang PGO) and windows (plain MSVC;
      # PGO there is LTCG-bound). Linux builds inside the containers.
      - name: Build the C static library (PGO where it pays)
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/ci-lib-build.sh

      - name: Ensure binfmt handlers for the emulated arches
        if: matrix.archs
        run: docker run --privileged --rm tonistiigi/binfmt --install arm,ppc64le,s390x

      - name: cibuildwheel
        uses: pypa/cibuildwheel@v3.0.1
        env:
          CIBW_BUILD: ${{ matrix.builds }}
          CIBW_ARCHS_LINUX: ${{ matrix.archs || 'auto' }}
          CIBW_ARCHS_MACOS: ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
          CIBW_ARCHS_WINDOWS: ${{ runner.arch == 'ARM64' && 'ARM64' || 'AMD64' }}
          # relative to the build context: /project only exists in the
          # Linux docker cells, native mac/win runners need this
          CIBW_ENVIRONMENT: >-
            TEPTRIS_INCLUDE=libteptris-src/src/include
            TEPTRIS_LIBDIR=libteptris-src/build/src
          # cp/rm/mv ONLY: the Windows cells run this through cmd,
          # where mkdir -p does not exist (proven the hard way). The
          # second cp nests src/ inside the first copy's directory;
          # the duplicated top-level entries match no package-data
          # glob and never reach the wheel.
          CIBW_BEFORE_BUILD: >-
            rm -rf src/teptris/_engine &&
            cp -r libteptris-src/src src/teptris/_engine &&
            cp -r libteptris-src/src src/teptris/_engine/src &&
            cp libteptris-src/LICENSE.md src/teptris/_engine/LICENSE.md
          CIBW_BEFORE_ALL_LINUX: >-
            set -eux;
            if command -v apk >/dev/null 2>&1; then apk add --no-cache build-base bash; fi;
            python3 -m pip install -q cmake ninja;
            python3 libteptris-src/scripts/gen_bench_corpus.py libteptris-src/bench-corpus;
            TEPTRIS_PGO_LTO=1 bash libteptris-src/scripts/build-pgo.sh
            libteptris-src libteptris-src/build libteptris-src/bench-corpus
          CIBW_TEST_COMMAND: >-
            python -c "import teptris; assert teptris.loads('a = 1') == {'a': 1};
            o = teptris.loads('t = 07:32\n[m]\nk = 1.5\n');
            assert teptris.loads(teptris.dumps(o)) == o; print('smoke ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.builds }}
          path: wheelhouse/*.whl
